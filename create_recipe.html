<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New Recipe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
  body { background: #1c1c1c; display: flex; justify-content: center; }
  .phone { width: 375px; max-width: 100%; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { display: flex; align-items: center; padding: 18px 16px 10px; }
  .back { display: flex; flex-direction: column; align-items: flex-start; margin-right: 18px; cursor: pointer; }
  .back .arrow { font-size: 34px; font-weight: bold; line-height: 1; }
  .back span:last-child { font-size: 15px; }
  .header h1 { font-size: 17px; font-weight: normal; letter-spacing: 1px; }

  /* Form */
  form { padding: 6px 22px 20px; flex: 1; }
  label { display: block; font-size: 16px; margin: 14px 0 4px; }
  input[type="text"], textarea {
    width: 100%; background: #d9d9d9; border: none; outline: none;
    font-size: 15px; color: #555; padding: 10px 12px; resize: none;
  }
  input[type="text"] { height: 42px; }
  input::placeholder, textarea::placeholder { color: #8a8a8a; }
  textarea.tall { height: 115px; }
  textarea.medium { height: 95px; }

  /* Save button */
  .save-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #d9d9d9; border: none; border-radius: 4px;
    width: 78%; margin: 26px auto 10px; padding: 10px;
    font-size: 16px; letter-spacing: 1px; cursor: pointer; color: #333;
  }
  .save-btn .plus {
    width: 38px; height: 38px; background: #000; color: #fff;
    border-radius: 50%; font-size: 26px; line-height: 38px; text-align: center;
  }

  /* Bottom nav */
  nav {
    display: flex; background: #e6e6e6; border-top: 1px solid #ccc;
    padding: 8px 0 10px;
  }
  nav a {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: #000; font-size: 9px; letter-spacing: 0.5px;
  }
  nav svg { width: 30px; height: 30px; margin-bottom: 2px; }
  nav a.active .icon-circle {
    width: 44px; height: 44px; background: #000; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin-bottom: 2px;
  }
  nav a.active .icon-circle svg { width: 26px; height: 26px; margin: 0; }
</style>
</head>
<body>
<div class="phone">

  <div class="header">
    <div class="back">
      <span class="arrow">&#8592;</span>
      <span>Back</span>
    </div>
    <h1>ADD NEW RECIPE</h1>
  </div>

  <form>
    <label>RECIPE NAME*</label>
    <input type="text" placeholder="Enter recipe name">

    <label>Description*</label>
    <textarea class="tall" placeholder="Enter Description"></textarea>

    <label>Origin Story*</label>
    <textarea class="medium" placeholder="Enter Origin Story"></textarea>

    <label>Ingredients*</label>
    <textarea class="medium" placeholder="Enter Ingredients"></textarea>

    <label>Instructions*</label>
    <textarea class="tall" placeholder="Enter Instructions"></textarea>

    <button type="submit" class="save-btn"><span class="plus">+</span> SAVE RECIPE</button>
  </form>

  <nav>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="black"><path d="M12 3l9 8h-3v9h-4v-6H10v6H6v-9H3z"/></svg>
      HOME
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="black"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      FAVORITES
    </a>
    <a href="#" class="active">
      <span class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      NEW RECIPE
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="black"><path d="M5 3h11a3 3 0 013 3v15H8a3 3 0 01-3-3V3zm3 4v2h8V7H8zm0 4v2h8v-2H8z"/></svg>
      COLLECTIONS
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="black"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5v1H4v-1z"/></svg>
      PROFILE
    </a>
  </nav>

</div>
</body>
</html>
