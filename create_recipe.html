
<!doctype html>
<html lang="en">
  <head>
    <title>Add New Recipe</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container mt-5 pb-5 mb-5">
      <!-- Page title -->
      <h1 id="page-title" class="display-6 fw-bold text-center mb-4">
        ADD NEW RECIPE
      </h1>

      <!-- Form -->
      <form
        id="recipe-form"
        class="mx-auto p-4 p-md-5 border rounded-3"
        style="max-width: 750px;"
      >
        <div class="mb-4">
          <label for="recipe-image" class="form-label fs-5 fw-semibold">
            Recipe Image (optional)
          </label>
          <input
            type="file"
            id="recipe-image"
            class="form-control form-control-lg"
            accept="image/*"
          />
          <div class="form-text">
            Large photos are resized automatically.
          </div>
          <img
            id="image-preview"
            class="recipe-image recipe-image-lg d-none mt-3"
            alt="Preview of the selected image"
          />
          <button
            type="button"
            id="remove-image-btn"
            class="btn btn-outline-secondary btn-sm d-none"
          >
            Remove image
          </button>
        </div>

        <div class="mb-4">
          <label for="recipe-name" class="form-label fs-5 fw-semibold">
            Recipe Name*
          </label>
          <input
            type="text"
            id="recipe-name"
            class="form-control form-control-lg"
            placeholder="Enter recipe name"
            required
          />
        </div>

        <div class="mb-4">
          <label for="description" class="form-label fs-5 fw-semibold">
            Description*
          </label>
          <textarea
            id="description"
            class="form-control form-control-lg"
            rows="5"
            placeholder="Enter Description"
            required
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="origin" class="form-label fs-5 fw-semibold">
            Origin Story*
          </label>
          <textarea
            id="origin"
            class="form-control form-control-lg"
            rows="4"
            placeholder="Enter Origin Story"
            required
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="ingredients" class="form-label fs-5 fw-semibold">
            Ingredients*
          </label>
          <textarea
            id="ingredients"
            class="form-control form-control-lg"
            rows="4"
            placeholder="Enter Ingredients"
            required
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="instructions" class="form-label fs-5 fw-semibold">
            Instructions*
          </label>
          <textarea
            id="instructions"
            class="form-control form-control-lg"
            rows="5"
            placeholder="Enter Instructions"
            required
          ></textarea>
        </div>

        <button
          type="submit"
          class="btn btn-warning btn-lg px-5 fw-semibold mt-2"
        >
          Save Recipe
        </button>
      </form>
    </div>

    <div id="site-nav"></div>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/createRecipe.js"></script>
  </body>
</html>
