<!doctype html>
<html lang="en">
  <head>
    <title>Create New Book</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container mt-5 pb-5 mb-5">
      <!-- Page title -->
      <h1 class="display-6 fw-bold text-center mb-4">Create New Book</h1>

      <!-- Form -->
      <form
        id="book-form"
        class="mx-auto p-4 p-md-5 border rounded-3"
        style="max-width: 750px"
      >
        <div class="mb-4">
          <label for="book-name" class="form-label fs-5 fw-semibold">
            Book Name*
          </label>
          <input
            type="text"
            id="book-name"
            class="form-control form-control-lg"
            placeholder="Enter Book Name"
            required
          />
        </div>

        <div class="mb-4">
          <label for="book-description" class="form-label fs-5 fw-semibold">
            Description*
          </label>
          <textarea
            id="book-description"
            class="form-control form-control-lg"
            rows="5"
            placeholder="Enter Description"
            required
          ></textarea>
        </div>

        <button
          type="submit"
          class="btn btn-warning btn-lg px-5 fw-semibold mt-2"
        >
          Save Book
        </button>
      </form>
    </div>

    <div id="site-nav"></div>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/createBook.js"></script>
  </body>
</html>
