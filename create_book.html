<!doctype html>
<html lang="en">
  <head>
    <title>Create New Book</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <div class="container-fluid bg-white px-0 pb-5 mb-5">
      <!-- Page title -->
      <h1 class="h2 fw-bold text-center px-3 pt-4 pb-2 mb-0">Create New Book</h1>

      <!-- Form -->
      <form id="recipe-form" class="px-4 px-md-5 pb-4">
        <div class="mb-3">
          <label for="recipe-name" class="form-label">Book Name*</label>
          <input type="text" id="recipe-name" class="form-control bg-secondary-subtle border-0 rounded-0" placeholder="Enter Book Name" required />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description*</label>
          <textarea id="description" class="form-control bg-secondary-subtle border-0 rounded-0" rows="4" placeholder="Enter Description" required></textarea>
        </div>

        <button type="submit" class="save-btn mt-4">SAVE BOOK</button>
      </form>
    </div>

    <div id="site-nav"></div>

    <script type="module" src="./src/main.js"></script>
    <script type="module" src="./src/createBook.js"></script>

  </body>
</html>
