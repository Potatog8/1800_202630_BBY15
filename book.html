<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Book | Heirloom Recipes</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <div id="site-header"></div>

    <main class="container mt-5 pb-5 mb-5">
      <a href="books.html" class="text-decoration-none">&larr; Back to Books</a>

      <!-- Book details -->
      <section id="book-details" class="mt-3 mb-4 d-none">
        <h1 id="book-title" class="fw-bold text-break"></h1>
        <p id="book-description" class="text-secondary text-break"></p>

        <p id="join-code-line" class="small text-secondary d-none">
          Join code:
          <span id="book-join-code" class="fw-bold text-body user-select-all"></span>
        </p>

        <div class="d-flex gap-2">
          <a
            href="create_recipe.html"
            id="add-recipe-btn"
            class="btn btn-warning"
          >
            Add Recipe
          </a>
          <button
            type="button"
            class="btn btn-outline-secondary"
            data-bs-toggle="modal"
            data-bs-target="#membersModal"
          >
            View Members
          </button>
        </div>

        <!-- Recipes in this book -->
        <div class="mt-5">
          <h2 class="h4 mb-3">Recipes</h2>

          <div class="row g-4" id="recipe-list">
            <!-- Recipes will appear here -->
          </div>

          <div id="no-recipes" class="text-center py-5 d-none">
            <h4>No recipes yet!</h4>
            <p class="text-secondary">Add the first recipe to this book.</p>
          </div>
        </div>
      </section>

      <!-- Not found state -->
      <div id="book-not-found" class="text-center py-5 d-none">
        <h4>Book not found</h4>
        <p class="text-secondary">
          This book doesn't exist or isn't in your books.
        </p>
      </div>
    </main>

    <!-- Members modal -->
    <div
      class="modal fade"
      id="membersModal"
      tabindex="-1"
      aria-labelledby="membersModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="membersModalLabel">Members</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <ul class="list-group" id="members-list"></ul>
            <p
              id="members-message"
              class="text-secondary text-center mb-0 d-none"
            ></p>
          </div>
        </div>
      </div>
    </div>
    <div id="site-nav"></div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/book.js"></script>
  </body>
</html>
