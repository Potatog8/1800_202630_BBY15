<!doctype html>
<html lang="en">
  <head>
    <title>Log In / Sign Up | Heirloom Recipes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main class="container py-5" style="max-width: 480px">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 id="title" class="h3 fw-bold mb-4 text-center">Welcome back</h1>

          <!-- Toggle -->
          <div class="btn-group w-100 mb-4" role="group" aria-label="Choose mode">
            <button type="button" id="tab-login" class="btn btn-primary">Log In</button>
            <button type="button" id="tab-signup" class="btn btn-outline-primary">Sign Up</button>
          </div>

          <div id="error" class="alert alert-danger d-none" role="alert"></div>

          <form id="auth-form">
            <!-- Only shown in sign up mode -->
            <div class="mb-3 d-none" id="name-group">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" minlength="6" required />
              <div class="form-text d-none" id="password-hint">At least 6 characters.</div>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary w-100 btn-lg">Log In</button>
          </form>
        </div>
      </div>
    </main>

    <script type="module" src="./src/loginSignup.js"></script>
  </body>
</html>
